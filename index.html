<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prasanna Shree | Aspiring Data Analyst</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

:root{
    --bg:#050816;
    --bg2:#0a1020;
    --card:rgba(255,255,255,.055);
    --border:rgba(255,255,255,.10);
    --text:#f5f7ff;
    --muted:#9ba6bc;
    --cyan:#62ddff;
    --purple:#8b7cff;
    --pink:#f06bca;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
}

/* BACKGROUND */

body::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    background:#00bfff;
    filter:blur(130px);
    opacity:.13;
    top:-220px;
    left:-180px;
    z-index:-5;
    animation:orb1 10s infinite alternate ease-in-out;
}

body::after{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    background:#8b5cff;
    filter:blur(130px);
    opacity:.14;
    right:-200px;
    bottom:-220px;
    z-index:-5;
    animation:orb2 12s infinite alternate ease-in-out;
}

@keyframes orb1{
    to{transform:translate(150px,100px) scale(1.2)}
}

@keyframes orb2{
    to{transform:translate(-130px,-100px) scale(1.2)}
}

/* NAV */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
    display:flex;
    justify-content:center;
    padding:18px 5%;
    background:rgba(5,8,22,.60);
    backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,.06);
}

nav ul{
    display:flex;
    gap:28px;
    list-style:none;
}

nav a{
    color:#b9c2d4;
    text-decoration:none;
    font-size:14px;
    transition:.3s;
}

nav a:hover{
    color:var(--cyan);
}

/* HERO */

.hero{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
    padding:120px 20px 70px;
}

.hero-content{
    position:relative;
    z-index:5;
    animation:heroIn 1.2s ease forwards;
}

@keyframes heroIn{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.hello{
    color:var(--cyan);
    letter-spacing:3px;
    font-size:14px;
    margin-bottom:20px;
}

.hero h1{
    font-size:clamp(55px,10vw,110px);
    line-height:.95;
    letter-spacing:-5px;
    margin-bottom:20px;
}

.gradient{
    background:linear-gradient(
        90deg,
        var(--cyan),
        var(--purple),
        var(--pink),
        var(--cyan)
    );
    background-size:300%;
    -webkit-background-clip:text;
    color:transparent;
    animation:gradientMove 5s infinite alternate;
}

@keyframes gradientMove{
    to{background-position:100%}
}

.hero h2{
    font-size:25px;
    color:#d5dae5;
    font-weight:400;
    min-height:35px;
}

.hero-description{
    max-width:680px;
    margin:25px auto;
    color:var(--muted);
    line-height:1.9;
    font-size:17px;
}

.buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:14px;
    margin-top:28px;
}

.btn{
    padding:14px 25px;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;
    transition:.35s;
}

.primary{
    color:#fff;
    background:linear-gradient(
        100deg,
        #009edc,
        #795bea
    );
    box-shadow:0 0 35px #009edc22;
}

.secondary{
    color:#fff;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.035);
}

.btn:hover{
    transform:translateY(-6px);
    box-shadow:0 15px 40px #0009;
}
